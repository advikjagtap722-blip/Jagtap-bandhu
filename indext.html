<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fresh Veggies Shop</title>
  <style>
    /* General Styles */
    body {
      font-family: Arial, sans-serif;
      background-color: #e8f5e9;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      background-color: #4caf50;
      color: white;
      padding: 20px 10px;
    }

    header img {
      width: 60px;
      vertical-align: middle;
      border-radius: 10px;
      margin-right: 10px;
    }

    header h1 {
      display: inline;
      font-size: 26px;
      vertical-align: middle;
    }

    .intro {
      margin: 10px;
      font-size: 16px;
      padding: 10px;
      color: #333;
    }

    .veg-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin: 10px;
    }

    .veg {
      background: white;
      margin: 10px;
      padding: 10px;
      border-radius: 10px;
      width: 140px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .veg img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 10px;
    }

    .veg button {
      background: #4caf50;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      margin-top: 5px;
      font-size: 14px;
      cursor: pointer;
    }

    #cart {
      background: white;
      margin: 20px 10px;
      padding: 15px;
      border-radius: 10px;
      text-align: left;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .cart-header {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .cart-item div {
      display: flex;
      align-items: center;
    }

    .cart-item button {
      margin-left: 5px;
      padding: 2px 6px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
      border: none;
    }

    #placeOrderBtn {
      width: 100%;
      background: #4caf50;
      color: white;
      padding: 10px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

  </style>
</head>
<body>

  <!-- Header with shop name and thumbnail -->
  <header>
    <img src="https://i.ibb.co/9r0f7qS/vegetables-logo.png" alt="Shop Logo">
    <h1>Fresh Veggies Shop</h1>
  </header>

  <!-- Intro about shop -->
  <div class="intro">
    Welcome to Fresh Veggies Shop! 🥦  
    We deliver fresh, high-quality vegetables directly to your doorstep.  
    Select your favorites, adjust quantity, and place your order!
  </div>

  <!-- Vegetable list with images -->
  <div class="veg-list">
    <div class="veg">
      <img src="https://i.ibb.co/7NvYtL4/tomato.jpg" alt="Tomato">
      <p>Tomato – ₹20</p>
      <button onclick="addToCart('Tomato', 20)">Add</button>
    </div>
    <div class="veg">
      <img src="https://i.ibb.co/wCq3Lqh/potato.jpg" alt="Potato">
      <p>Potato – ₹30</p>
      <button onclick="addToCart('Potato', 30)">Add</button>
    </div>
    <div class="veg">
      <img src="https://i.ibb.co/0D7hTQC/onion.jpg" alt="Onion">
      <p>Onion – ₹25</p>
      <button onclick="addToCart('Onion', 25)">Add</button>
    </div>
    <div class="veg">
      <img src="https://i.ibb.co/n6J3R9h/carrot.jpg" alt="Carrot">
      <p>Carrot – ₹40</p>
      <button onclick="addToCart('Carrot', 40)">Add</button>
    </div>
  </div>

  <!-- Cart -->
  <div id="cart">
    <div class="cart-header">🛒 Cart</div>
    <div id="cartItems">No items</div>
    <h3>Total: ₹<span id="total">0</span></h3>
    <button id="placeOrderBtn" onclick="placeOrder()">Place Order</button>
  </div>

  <!-- JavaScript -->
  <script>
    let cart = [];
    let total = 0;

    function addToCart(name, price) {
      let existing = cart.find(item => item.name === name);
      if(existing){
        existing.quantity += 1;
      } else {
        cart.push({name: name, price: price, quantity: 1});
      }
      updateCart();
    }

    function removeFromCart(name){
      cart = cart.filter(item => item.name !== name);
      updateCart();
    }

    function increaseQty(name){
      let item = cart.find(i => i.name === name);
      if(item){
        item.quantity += 1;
      }
      updateCart();
    }

    function decreaseQty(name){
      let item = cart.find(i => i.name === name);
      if(item){
        item.quantity -= 1;
        if(item.quantity <= 0){
          removeFromCart(name);
        }
      }
      updateCart();
    }

    function updateCart(){
      let cartDiv = document.getElementById("cartItems");
      if(cart.length === 0){
        cartDiv.innerHTML = "No items";
        total = 0;
        document.getElementById("total").innerText = total;
        return;
      }

      total = 0;
      cartDiv.innerHTML = "";
      cart.forEach(item => {
        total += item.price * item.quantity;

        let div = document.createElement("div");
        div.className = "cart-item";
        div.innerHTML = `
          ${item.name} x ${item.quantity} = ₹${item.price * item.quantity}
          <div>
            <button onclick="increaseQty('${item.name}')">+</button>
            <button onclick="decreaseQty('${item.name}')">−</button>
            <button onclick="removeFromCart('${item.name}')">Remove</button>
          </div>
        `;
        cartDiv.appendChild(div);
      });

      document.getElementById("total").innerText = total;
    }

    function placeOrder(){
      if(cart.length === 0){
        alert("Cart is empty!");
        return;
      }
      alert("Order placed successfully!\nTotal: ₹" + total);
      cart = [];
      updateCart();
    }
  </script>

</body>
</html>
